name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: school_test
          POSTGRES_USER: school
          POSTGRES_PASSWORD: local-integration-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U school -d school_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://school:local-integration-password@127.0.0.1:5432/school_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
