services:
  - type: web
    name: bekobod-school-api
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run deploy:check -- backend
    startCommand: npm run start:backend
    healthCheckPath: /api/health
    disk:
      name: school-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.17.0
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/school.sqlite
      - key: BACKUP_ENABLED
        value: "true"
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: PUBLIC_ORIGIN
        sync: false
      - key: API_PROXY_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: school-images
      - key: BACKUP_STORAGE_BUCKET
        sync: false
